name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for Vercel production deployment
        if: github.event_name == 'push'
        run: sleep 90
      - name: Run production smoke
        env:
          PRODUCTION_BASE_URL: https://hajihazai.vercel.app
        run: npm run smoke:production
