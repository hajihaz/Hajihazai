name: DB Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hajihazai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hajihazai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enable database extensions
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d hajihazai_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply current schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hajihazai_test
        run: npx drizzle-kit push --force
      - name: Seed deterministic fixtures
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hajihazai_test
        run: npm run db:test:seed
      - name: Run full regression suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hajihazai_test
          LOCAL_E2E_DB: "1"
          PGTZ: UTC
        run: npx vitest run
